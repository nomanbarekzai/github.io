<!-- filename: index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Halal Horizons Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- W3.CSS + optional font/icons -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    body { font-family: "Raleway", sans-serif; }
    .w3-card-4 img { display: block; width: 100%; height: auto; }
    .w3-opacity { margin-top: 4px; }
  </style>
</head>
<body class="w3-light-grey">

  <!-- Header -->
  <header class="w3-container w3-center w3-padding-32">
    <h1 class="w3-xxlarge">Halal Horizons Gallery</h1>
    <p class="w3-opacity">Destinations • Dining • Activities</p>
  </header>

  <!-- Main Gallery -->
  <section id="gallery-main" class="w3-content" style="max-width:1200px">
    <div class="w3-row">

      <!-- Card 1 -->
      <div class="w3-col s12 m6 l4 w3-padding">
        <div class="w3-card-4 category-destination region-europe">
          <img src="images/paris.jpg" alt="Paris skyline at sunset">
          <div class="w3-container">
            <h3>Paris</h3>
            <p class="w3-opacity">Destination • Europe</p>
          </div>
        </div>
      </div>

      <!-- Add more cards here as needed -->

    </div>
  </section>

</body>
</html>
